# Controls GitHub's auto-generated release notes (used by GoReleaser's
# changelog.use: github-native). Categorization is by PR label, so PRs need
# the matching labels to land in a section; otherwise they fall under "Other
# Changes" via the catch-all "*".
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - github-actions
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
    - title: Maintenance
      labels:
        - chore
        - ci
        - refactor
        - test
        - style
        - perf
    - title: Other Changes
      labels:
        - "*"
