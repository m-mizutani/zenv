version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - name_template: >-
      {{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  # Leave the GitHub release as a draft so assets can be reviewed before
  # publishing. Publishing manually is also what makes the flow compatible
  # with GitHub's immutable releases (the lock happens at publish time).
  draft: true

changelog:
  # Delegate note generation to GitHub so the release shows the familiar
  # "What's Changed" / "@user in #N" / "Full Changelog" format. Grouping and
  # exclusions are then controlled by .github/release.yml, not here.
  use: github-native
